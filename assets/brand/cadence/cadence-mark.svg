<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-labelledby="cadence-title cadence-desc">
  <title id="cadence-title">Cadence orbital mark</title>
  <desc id="cadence-desc">A central circular core with three concentric rings and eight evenly spaced nodes on the outer ring.</desc>
  <style>
    .ring { fill:none; stroke:currentColor; vector-effect:non-scaling-stroke; }
    .outer { stroke-width:1.6; opacity:.92; }
    .middle { stroke-width:1.3; opacity:.58; }
    .inner { stroke-width:1.15; opacity:.38; }
    .node { fill:currentColor; opacity:.90; }
    .core { fill:currentColor; opacity:.96; }
  </style>
  <g id="cadence-mark">
    <circle class="ring outer" cx="50" cy="50" r="36"/>
    <circle class="ring middle" cx="50" cy="50" r="24.5"/>
    <circle class="ring inner" cx="50" cy="50" r="13.5"/>
    <circle class="core" cx="50" cy="50" r="4.2"/>
    <g id="outer-nodes">
      <circle class="node" cx="50" cy="14" r="3"/>
      <circle class="node" cx="75.456" cy="24.544" r="3"/>
      <circle class="node" cx="86" cy="50" r="3"/>
      <circle class="node" cx="75.456" cy="75.456" r="3"/>
      <circle class="node" cx="50" cy="86" r="3"/>
      <circle class="node" cx="24.544" cy="75.456" r="3"/>
      <circle class="node" cx="14" cy="50" r="3"/>
      <circle class="node" cx="24.544" cy="24.544" r="3"/>
    </g>
  </g>
</svg>
