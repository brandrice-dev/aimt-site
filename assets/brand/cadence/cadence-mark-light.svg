<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Cadence orbital mark, light surface version" style="color:#1D1C1A">
  <style>
    .ring { fill:none; stroke:currentColor; vector-effect:non-scaling-stroke; }
    .outer { stroke-width:1.6; opacity:.96; }
    .middle { stroke-width:1.3; opacity:.66; }
    .inner { stroke-width:1.15; opacity:.46; }
    .node { fill:currentColor; opacity:.94; }
    .core { fill:currentColor; opacity:.98; }
  </style>
  <circle class="ring outer" cx="50" cy="50" r="36"/>
  <circle class="ring middle" cx="50" cy="50" r="24.5"/>
  <circle class="ring inner" cx="50" cy="50" r="13.5"/>
  <circle class="core" cx="50" cy="50" r="4.2"/>
  <g>
    <circle class="node" cx="50" cy="14" r="3"/><circle class="node" cx="75.456" cy="24.544" r="3"/>
    <circle class="node" cx="86" cy="50" r="3"/><circle class="node" cx="75.456" cy="75.456" r="3"/>
    <circle class="node" cx="50" cy="86" r="3"/><circle class="node" cx="24.544" cy="75.456" r="3"/>
    <circle class="node" cx="14" cy="50" r="3"/><circle class="node" cx="24.544" cy="24.544" r="3"/>
  </g>
</svg>
