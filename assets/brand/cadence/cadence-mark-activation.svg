<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Animated Cadence activation mark" style="color:#F2EEE6">
  <defs>
    <filter id="bloom" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="4.2"/>
    </filter>
  </defs>
  <style>
    .ring{fill:none;stroke:currentColor;vector-effect:non-scaling-stroke}
    .outer{stroke-width:1.6;opacity:.94}
    .middle{stroke-width:1.3;opacity:.60;animation:innerFocus 1600ms cubic-bezier(.22,.61,.36,1) both}
    .inner{stroke-width:1.15;opacity:.40;animation:innerFocus 1600ms cubic-bezier(.22,.61,.36,1) both}
    .node{fill:currentColor;opacity:.92;transform-box:fill-box;transform-origin:center;animation:nodeSignal 1600ms cubic-bezier(.22,.61,.36,1) both}
    .core{fill:currentColor;opacity:.98;transform-origin:50px 50px;animation:coreFocus 1600ms cubic-bezier(.22,.61,.36,1) both}
    .outerSystem{transform-origin:50px 50px;animation:outerOrbit 1600ms cubic-bezier(.22,.61,.36,1) both}
    .trace{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:13 214;opacity:0;vector-effect:non-scaling-stroke;animation:tracePass 1600ms cubic-bezier(.22,.61,.36,1) both}
    .bloom{fill:currentColor;opacity:0;filter:url(#bloom);transform-origin:50px 50px;animation:bloomPulse 1600ms cubic-bezier(.22,.61,.36,1) both}
    .n1{animation-delay:120ms}.n2{animation-delay:205ms}.n3{animation-delay:290ms}.n4{animation-delay:375ms}.n5{animation-delay:460ms}.n6{animation-delay:545ms}.n7{animation-delay:630ms}.n8{animation-delay:715ms}
    @keyframes outerOrbit{0%,8%{transform:rotate(0deg)}68%{transform:rotate(360deg)}100%{transform:rotate(360deg)}}
    @keyframes tracePass{0%,9%{opacity:0;stroke-dashoffset:0}16%{opacity:.72}64%{opacity:.25;stroke-dashoffset:-212}72%,100%{opacity:0;stroke-dashoffset:-212}}
    @keyframes nodeSignal{0%,12%,78%,100%{opacity:.92;transform:scale(1)}30%{opacity:1;transform:scale(1.24)}42%{opacity:.92;transform:scale(1)}}
    @keyframes innerFocus{0%,38%,100%{opacity:var(--rest,.60)}62%{opacity:.88}}
    @keyframes coreFocus{0%,36%,100%{transform:scale(1);opacity:.98}60%{transform:scale(1.20);opacity:1}72%{transform:scale(1.04);opacity:1}}
    @keyframes bloomPulse{0%,42%,100%{opacity:0;transform:scale(.65)}59%{opacity:.16;transform:scale(1.15)}76%{opacity:.05;transform:scale(1.55)}}
    @media (prefers-reduced-motion:reduce){.outerSystem,.trace,.node,.core,.middle,.inner,.bloom{animation:none!important}}
  </style>
  <circle class="bloom" cx="50" cy="50" r="12"/>
  <circle class="ring middle" style="--rest:.60" cx="50" cy="50" r="24.5"/>
  <circle class="ring inner" style="--rest:.40" cx="50" cy="50" r="13.5"/>
  <circle class="core" cx="50" cy="50" r="4.2"/>
  <g class="outerSystem">
    <circle class="ring outer" cx="50" cy="50" r="36"/>
    <circle class="trace" cx="50" cy="50" r="36"/>
    <circle class="node n1" cx="50" cy="14" r="3"/><circle class="node n2" cx="75.456" cy="24.544" r="3"/>
    <circle class="node n3" cx="86" cy="50" r="3"/><circle class="node n4" cx="75.456" cy="75.456" r="3"/>
    <circle class="node n5" cx="50" cy="86" r="3"/><circle class="node n6" cx="24.544" cy="75.456" r="3"/>
    <circle class="node n7" cx="14" cy="50" r="3"/><circle class="node n8" cx="24.544" cy="24.544" r="3"/>
  </g>
</svg>
