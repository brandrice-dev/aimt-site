<!-- AIMT canonical orbital mark — normal site/navigation identity.
     NOT the burgundy credential badge (that mark represents an EARNED
     credential only; see assets/brand/aimt-badge-*.png).

     Restored to the owner-approved geometry (matches the identical
     <symbol id="aimtOrbitalMark"> already inlined in courses.html and
     headspa-mastery.html) after a prior pass mistakenly repointed this
     file at the Cadence designer pack's geometry while trying to
     standardize the Cadence mark -- AIMT's institute identity and
     Cadence's assistant identity are deliberately SEPARATE marks now;
     see assets/brand/cadence/cadence-mark.svg for Cadence's own file.

     This file is no longer referenced live via
     `<use href="assets/brand/aimt-orbital-mark.svg#aimtOrbitalMark">`
     (cross-document SVG <use> silently renders nothing in this site's
     target browsers -- confirmed by isolated test, and the root cause of
     the nav mark/Cadence marks going invisible). Every page instead
     inlines this exact geometry as a local
     `<symbol id="aimtOrbitalMark" viewBox="0 0 44 44">` near the top of
     its own <body>, and references it same-document via
     `<use href="#aimtOrbitalMark">`. This file remains the canonical
     source of that geometry -- copy from here, verbatim, when adding the
     mark to a new page; do not hand-redraw it.
     Circles use currentColor, so the referencing element's CSS `color`
     controls the rendered color. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <g id="aimtOrbitalMark">
    <circle cx="22" cy="22" r="20" stroke="currentColor" stroke-width="0.75" opacity="0.6"/>
    <circle cx="22" cy="22" r="13.5" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
    <circle cx="22" cy="22" r="7" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
    <circle cx="22" cy="22" r="2" fill="currentColor"/>
    <circle cx="22" cy="2" r="1.5" fill="currentColor" opacity="0.75"/>
    <circle cx="36.1" cy="7.9" r="1.5" fill="currentColor" opacity="0.75"/>
    <circle cx="42" cy="22" r="1.5" fill="currentColor" opacity="0.75"/>
    <circle cx="36.1" cy="36.1" r="1.5" fill="currentColor" opacity="0.75"/>
    <circle cx="22" cy="42" r="1.5" fill="currentColor" opacity="0.75"/>
    <circle cx="7.9" cy="36.1" r="1.5" fill="currentColor" opacity="0.75"/>
    <circle cx="2" cy="22" r="1.5" fill="currentColor" opacity="0.75"/>
    <circle cx="7.9" cy="7.9" r="1.5" fill="currentColor" opacity="0.75"/>
  </g>
</svg>
