<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc"><title id="title">How surfactants connect oil and water</title><desc id="desc">A blue hydrophilic head interacts with water. A gold hydrophobic tail associates with oil. Around an oil droplet in water, heads face outward into water and tails point inward into oil. This simplified cross-section illustrates one part of cleansing, not a specific molecule or a micelle.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#52626b" stroke-width="1.5"/></marker></defs><rect width="720" height="1000" rx="20" fill="#f6f3ec"/><g font-family="Arial,sans-serif" fill="#20323d"><text x="36" y="48" font-size="17" letter-spacing="2">AIMT · CLEANSING SCIENCE</text><text x="36" y="92" font-size="32" font-weight="700">How surfactants work</text><text x="36" y="130" font-size="23">One molecule. Two different affinities.</text><line x1="36" y1="152" x2="684" y2="152" stroke="#d3d4cc"/><text x="36" y="190" font-size="23" font-weight="700">01  The molecule</text><circle cx="160" cy="254" r="32" fill="#80bbd1" stroke="#245c74" stroke-width="3"/><path d="M193 254H237L257 238L281 270L305 238L329 270L353 238L377 270L401 254H475" fill="none" stroke="#ae7a26" stroke-width="8" stroke-linejoin="round"/><path d="M160 292V320H70M380 285V320H430" fill="none" stroke="#52626b" stroke-width="2"/><text x="40" y="353" font-size="26" fill="#245c74" font-weight="700">Hydrophilic head</text><text x="40" y="385" font-size="22">Polar / water-attracting</text><text x="40" y="416" font-size="22">Interacts with water</text><text x="392" y="353" font-size="26" fill="#94651c" font-weight="700">Hydrophobic tail</text><text x="392" y="385" font-size="22">Nonpolar / oil-attracting</text><text x="392" y="416" font-size="22">Associates with oil</text><line x1="36" y1="443" x2="684" y2="443" stroke="#d3d4cc"/><text x="36" y="485" font-size="23" font-weight="700">02  At an oil–water boundary</text><rect x="36" y="508" width="648" height="310" rx="16" fill="#e1eff3"/><text x="57" y="541" font-size="22" fill="#245c74">WATER</text><circle cx="360" cy="662" r="100" fill="#e7c987" stroke="#b68b3b" stroke-width="2"/><g transform="translate(472.00 662.00) rotate(0)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(465.25 700.31) rotate(20)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(445.80 733.99) rotate(40)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(416.00 758.99) rotate(60)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(379.45 772.30) rotate(80)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(340.55 772.30) rotate(100)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(304.00 758.99) rotate(120)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(274.20 733.99) rotate(140)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(254.75 700.31) rotate(160)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(248.00 662.00) rotate(180)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(254.75 623.69) rotate(200)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(274.20 590.01) rotate(220)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(304.00 565.01) rotate(240)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(340.55 551.70) rotate(260)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(379.45 551.70) rotate(280)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(416.00 565.01) rotate(300)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(445.80 590.01) rotate(320)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><g transform="translate(465.25 623.69) rotate(340)"><path d="M-12 0L-24 -4L-36 4L-48 -4L-60 0" fill="none" stroke="#ae7a26" stroke-width="4" stroke-linejoin="round"/><circle r="11" fill="#80bbd1" stroke="#245c74" stroke-width="2"/></g><text x="360" y="655" font-size="26" text-anchor="middle" font-weight="700">OIL</text><text x="360" y="686" font-size="22" text-anchor="middle">droplet</text><path d="M198 582H128V607" stroke="#52626b" stroke-width="2" fill="none"/><text x="58" y="636" font-size="21">Heads face</text><text x="58" y="663" font-size="21">the water</text><path d="M477 708H560V681" stroke="#52626b" stroke-width="2" fill="none"/><text x="516" y="640" font-size="21">Tails enter</text><text x="516" y="667" font-size="21">the oil</text><text x="360" y="797" font-size="18" text-anchor="middle">Simplified cross-section of a surfactant-coated oil droplet</text><text x="36" y="860" font-size="23" font-weight="700">03  Why this helps cleansing</text><text x="36" y="898" font-size="23">Surfactants help oil disperse in water,</text><text x="36" y="930" font-size="23">so it can be carried away during rinsing.</text><text x="36" y="974" font-size="17" fill="#58666d">Conceptual model · Not to scale · Molecular structures vary</text></g></svg>