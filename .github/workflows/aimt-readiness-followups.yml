name: AIMT Readiness Follow-ups
# Hourly eligible-lead sweep, 9 AM–7 PM America/New_York sending window.
# GitHub Actions may delay scheduled jobs. Two stages are time thresholds,
# not exact-to-the-minute send commitments.
# Until owner-approved address/budgets/activation are set in Supabase,
# the server responds "paused" and NO emails are sent.
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: 'Preview counts only. Does not reserve or send emails.'
        required: false
        default: true

concurrency:
  group: aimt-readiness-followups
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Run bounded signed campaign check
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOLLOWUP_MODE: ${{ github.event_name == 'schedule' && 'send' || 'dry' }}
        run: node scripts/readiness-followups-run.mjs
