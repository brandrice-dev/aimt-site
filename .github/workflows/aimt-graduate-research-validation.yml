name: AIMT Student Research Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/_lib/research/graduate-*.mjs'
      - 'functions/_lib/cadence/**'
      - 'functions/api/cadence/**'
      - 'assets/js/cadence-shell.js'
      - 'assets/js/aimt-learning-links.js'
      - 'assets/css/cadence-shell.css'
      - 'headspa-mastery.html'
      - 'tests/student-learning-research.test.mjs'
      - 'scripts/student-research-provider-check.mjs'
      - 'scripts/build-cadence-course-context.mjs'
      - 'scripts/_lib/cadence-course-excerpts.py'
      - 'scripts/_lib/student-learning-gap-triage.mjs'
      - 'functions/_lib/education-ops/student-learning-gaps.mjs'
      - 'functions/api/graduate-research.js'
      - 'functions/my-aimt/research.js'
      - 'assets/js/aimt-graduate-research.js'
      - 'assets/css/aimt-graduate-research.css'
      - 'tests/graduate-research-library.test.mjs'
      - 'scripts/graduate-research-live-check.mjs'
      - '.github/workflows/aimt-graduate-research-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graduate-research:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: node --test tests/graduate-research-library.test.mjs tests/education-public-research.test.mjs tests/public-deployment-surface.test.mjs tests/student-learning-research.test.mjs tests/cadence-phase3-ask-cadence.test.mjs tests/cadence-chat-scenario-gate.test.mjs tests/cadence-chat-trust-precision.test.mjs tests/cadence-thread-api.test.mjs tests/education-autonomous-recovery.test.mjs
      - run: node scripts/research-library-rls-check.mjs
      - name: Read-only real research and anonymous RLS check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/graduate-research-live-check.mjs
      - name: Bounded read-only real-provider research teaching QA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EDUCATION_WRITER_API_KEY }}
        run: node scripts/student-research-provider-check.mjs
