name: AIMT Hair Biology Editorial Review
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact editorial update PR
        type: string
        required: true
      candidate_head:
        description: Exact proposal commit SHA
        type: string
        required: true
      approve_review:
        description: Owner-approved $5 total / ten requests; revised probe approval required; cumulative ledger preserved
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: aimt-manual-batch-review-2026-11-09
  cancel-in-progress: false
jobs:
  independent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
        with:
          repository: brandrice-dev/aimt-research-feed
          ref: ee082171493ef2ec711361f9ab55c864c93afbb3
          token: ${{ secrets.RESEARCH_FEED_READ_TOKEN }}
          path: private-review
          persist-credentials: false
      - name: Install image conversion utility
        run: sudo apt-get update -qq && sudo apt-get install -y imagemagick
      - name: Review data-only proposal against the original cleared snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_PUBLICATION_EDITOR_API_KEY: ${{ secrets.ANTHROPIC_PUBLICATION_EDITOR_API_KEY }}
          ANTHROPIC_EDUCATION_WRITER_API_KEY: ${{ secrets.ANTHROPIC_EDUCATION_WRITER_API_KEY }}
          PACKET_SHA256: aacec382eac848f9d9a954588dd3503a91992fca29fc5c7e95f15aca0edf9975
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          APPROVE_REVIEW: ${{ inputs.approve_review }}
        run: node scripts/education-manual-final-clearance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-final-clearance-2026-11-09
          path: research-import/manual-final-clearance/
          if-no-files-found: error
          retention-days: 90
