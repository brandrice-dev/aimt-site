name: AIMT Hair Biology Editorial Review
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact editorial update PR
        type: string
        required: true
      candidate_head:
        description: Exact proposal commit SHA
        type: string
        required: true
      approve_review:
        description: Owner-approved $5 total / ten requests; runner uses stricter $2/six requests
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: aimt-manual-batch-review-2026-11-09
  cancel-in-progress: false
jobs:
  independent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
        with:
          repository: brandrice-dev/aimt-research-feed
          ref: cf55a889c5b2e5869bc2c2c199fed3406b09ed84
          token: ${{ secrets.RESEARCH_FEED_READ_TOKEN }}
          path: private-review
          persist-credentials: false
      - name: Review data-only proposal against the original cleared snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_EDUCATION_WRITER_API_KEY: ${{ secrets.ANTHROPIC_EDUCATION_WRITER_API_KEY }}
          PACKET_SHA256: 437701f0141cae239ca519e2a218b80acbeecd594c73583240e4ef4220d94611
          PR_NUMBER: ${{ inputs.pr_number }}
          CANDIDATE_HEAD: ${{ inputs.candidate_head }}
          APPROVE_REVIEW: ${{ inputs.approve_review }}
        run: node scripts/education-manual-batch-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-batch-review-2026-11-09
          path: research-import/manual-batch-review/
          if-no-files-found: error
          retention-days: 90
