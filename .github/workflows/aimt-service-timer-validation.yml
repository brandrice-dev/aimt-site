name: AIMT Service Timer Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'aimt-service-timer.html'
      - 'tests/aimt-service-timer-runtime.test.mjs'
      - '.github/workflows/aimt-service-timer-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - run: node --test tests/aimt-service-timer-runtime.test.mjs
