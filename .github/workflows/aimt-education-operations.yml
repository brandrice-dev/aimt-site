name: AIMT Education Operations

on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Approved bounded model diagnostic: shadow only, no database writes, issues, PRs, or publishing (up to 6 requests, $2 cost reservation, scalp-microbiome)."
        type: boolean
        default: false
        required: false

concurrency:
  group: aimt-education-operations
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore durable candidate bundles
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic }}
        run: |
          set -euo pipefail
          mkdir -p research-import/education-ops/candidates

          bundle_name="education-candidate-bundles"
          if [ "$DIAGNOSTIC" = "true" ]; then bundle_name="education-candidate-bundles-diagnostic"; fi
          latest_run_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${bundle_name}&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty'
          )"

          if [ -n "$latest_run_id" ]; then
            echo "Restoring candidate bundles from workflow run $latest_run_id"
            gh run download "$latest_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$bundle_name" \
              --dir research-import/education-ops/candidates
          else
            echo "No prior durable candidate bundle artifact found; starting without a resume candidate."
          fi

      - name: Run Education Operations shadow cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_PUBLICATION_EDITOR_API_KEY: ${{ secrets.ANTHROPIC_PUBLICATION_EDITOR_API_KEY }}
          ANTHROPIC_EDUCATION_WRITER_API_KEY: ${{ secrets.ANTHROPIC_EDUCATION_WRITER_API_KEY }}
          AIMT_EDUCATION_AUTOPUBLISH_ENABLED: ${{ vars.AIMT_EDUCATION_AUTOPUBLISH_ENABLED }}
          AIMT_EDUCATION_MAX_PAGES_PER_WEEK: ${{ vars.AIMT_EDUCATION_MAX_PAGES_PER_WEEK }}
          AIMT_RESEARCH_GAP_LOOP_ENABLED: ${{ vars.AIMT_RESEARCH_GAP_LOOP_ENABLED }}
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic }}
        run: |
          if [ "$DIAGNOSTIC" = "true" ]; then
            node scripts/education-publication-diagnostic.mjs --allow-model-calls
          else
            node scripts/education-operations-cycle.mjs --shadow
          fi

      - name: Upload run report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: education-ops-shadow-${{ github.run_id }}
          path: research-import/education-ops/runs/
          retention-days: 30

      - name: Upload durable candidate bundles
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic && 'education-candidate-bundles-diagnostic' || 'education-candidate-bundles' }}
          path: research-import/education-ops/candidates/
          retention-days: 90
          if-no-files-found: ignore
