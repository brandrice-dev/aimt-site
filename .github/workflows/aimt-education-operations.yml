name: AIMT Education Operations

on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Approved bounded model diagnostic: shadow only, no database writes, issues, PRs, or publishing (up to 6 requests, $2 cost reservation, scalp-microbiome)."
        type: boolean
        default: false
        required: false

      source_run_id:
        description: 'Exact continuation source run; must be the latest durable candidate archive. Empty starts from latest saved work.'
        type: string
        required: false

concurrency:
  group: aimt-education-operations
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore durable candidate bundles
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: node scripts/education-candidate-state-restore.mjs

      - name: Run Education Operations autonomous cycle
        id: cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_PUBLICATION_EDITOR_API_KEY: ${{ secrets.ANTHROPIC_PUBLICATION_EDITOR_API_KEY }}
          ANTHROPIC_EDUCATION_WRITER_API_KEY: ${{ secrets.ANTHROPIC_EDUCATION_WRITER_API_KEY }}
          AIMT_EDUCATION_AUTOPUBLISH_ENABLED: ${{ vars.AIMT_EDUCATION_AUTOPUBLISH_ENABLED }}
          AIMT_EDUCATION_MAX_PAGES_PER_WEEK: ${{ vars.AIMT_EDUCATION_MAX_PAGES_PER_WEEK }}
          AIMT_RESEARCH_GAP_LOOP_ENABLED: ${{ vars.AIMT_RESEARCH_GAP_LOOP_ENABLED }}
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic }}
        run: |
          if [ "$DIAGNOSTIC" = "true" ]; then
            node scripts/education-publication-diagnostic.mjs --allow-model-calls
          else
            node scripts/education-autonomous-cycle.mjs
          fi

      - name: Upload run report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: education-ops-shadow-${{ github.run_id }}
          path: research-import/education-ops/runs/
          retention-days: 30

      - name: Upload durable candidate bundles
        uses: actions/upload-artifact@v4
        if: always() && steps.restore.outputs.restored == 'true'
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic && 'education-candidate-bundles-diagnostic' || 'education-candidate-bundles' }}
          path: research-import/education-ops/candidates/
          retention-days: 90
          if-no-files-found: ignore

      - name: Continue saved work after the durable checkpoint is uploaded
        if: success() && steps.cycle.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run aimt-education-operations.yml --repo "$GITHUB_REPOSITORY" --ref main -f "source_run_id=$GITHUB_RUN_ID"
