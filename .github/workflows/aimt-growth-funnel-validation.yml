name: AIMT Growth Funnel Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/api/readiness/**'
      - 'functions/api/free-tools/**'
      - 'functions/api/admin/free-tool-leads.js'
      - 'assets/js/aimt-free-tool-capture.mjs'
      - 'tests/free-tool-capture.test.mjs'
      - 'supabase/migrations/*_free_tool_leads.sql'
      - 'privacy.html'
      - 'functions/api/founder-review/**'
      - 'functions/api/admin/founder-reviews.js'
      - 'functions/_lib/founder-review/**'
      - 'assets/js/aimt-founder-review.js'
      - 'tests/founder-review.test.mjs'
      - 'tests/founder-review-flow.test.mjs'
      - 'tests/founder-review-maintenance.test.mjs'
      - 'tests/support/founder-review-local-service.mjs'
      - 'assets/js/aimt-founder-offer.js'
      - 'assets/css/aimt-founder-offer.css'
      - 'scripts/founder-review-cleanup-run.mjs'
      - '.github/workflows/aimt-founder-review-cleanup.yml'
      - 'tests/founder-review-purchase.test.mjs'
      - 'tests/founder-review-sql.test.mjs'
      - 'supabase/migrations/20261105133743_founder_review_offer.sql'
      - 'functions/_lib/enrollment/paid-enrollment-email.mjs'
      - 'functions/api/create-checkout-session.js'
      - 'functions/api/stripe-webhook.js'
      - 'functions/api/meta-config.js'
      - 'functions/api/course-material.js'
      - 'functions/_lib/meta/**'
      - 'assets/js/aimt-meta.js'
      - 'assets/js/aimt-growth.js'
      - 'assets/js/aimt-public-nav.js'
      - 'tests/meta-measurement.test.mjs'
      - 'tests/paid-content-boundary.test.mjs'
      - 'tests/paid-content-media.test.mjs'
      - 'functions/api/course-session.js'
      - 'functions/_lib/paid-content/**'
      - 'functions/assets/**'
      - 'assets/js/aimt-paid-course-loader.js'
      - 'assets/js/aimt-paid-media-session.js'
      - 'scripts/paid-course-cutover.mjs'
      - 'scripts/_lib/private-course-snapshot.mjs'
      - 'tests/growth-measurement.test.mjs'
      - 'tests/growth-client.test.mjs'
      - 'headspa-mastery.html'
      - 'enroll.html'
      - 'success.html'
      - 'functions/api/claim-course-access.js'
      - 'assets/js/aimt-founder-review-admin.js'
      - 'tests/blueprint-autosave.test.mjs'
      - 'functions/api/admin/readiness-followups.js'
      - 'scripts/readiness-followups-run.mjs'
      - 'tests/readiness-followups.test.mjs'
      - 'tests/aimt-free-tools.test.mjs'
      - 'free-tools.html'
      - 'head-spa-service-cost.html'
      - 'first-service-blueprint.html'
      - 'assets/css/aimt-free-tools.css'
      - 'assets/js/aimt-service-cost-core.mjs'
      - 'assets/js/aimt-first-service-blueprint-core.mjs'
      - 'assets/js/aimt-course-resources.js'
      - 'sitemap.xml'
      - 'tests/admin-readiness-leads-layout.test.mjs'
      - 'supabase/migrations/20261104_add_readiness_followup_campaign.sql'
      - '.github/workflows/aimt-readiness-followups.yml'
      - 'functions/_lib/readiness/**'
      - 'functions/_lib/email/aimt-email-shell.mjs'
      - 'tests/readiness-profile-email.test.mjs'
      - 'functions/api/admin/readiness-leads.js'
      - 'functions/api/admin/checkout-diagnostics.js'
      - 'head-spa-readiness.html'
      - 'my-aimt.html'
      - 'readiness-enroll.html'
      - '_routes.json'
      - 'tests/readiness-final-decision.test.mjs'
      - 'admin.html'
      - 'assets/js/aimt-readiness-config.js'
      - 'tests/growth-funnel-repair.test.mjs'
      - '.github/workflows/aimt-growth-funnel-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Run offline growth, readiness, checkout regression tests
        run: |
          env -i PATH="$PATH" node --test \
            tests/readiness-profile-email.test.mjs \
            tests/readiness-followups.test.mjs \
            tests/aimt-free-tools.test.mjs \
            tests/free-tool-capture.test.mjs \
            tests/founder-review.test.mjs \
            tests/founder-review-maintenance.test.mjs \
            tests/founder-review-purchase.test.mjs \
            tests/blueprint-autosave.test.mjs \
            tests/admin-readiness-leads-layout.test.mjs \
            tests/readiness-final-decision.test.mjs \
            tests/growth-funnel-repair.test.mjs \
            tests/growth-measurement.test.mjs \
            tests/meta-measurement.test.mjs \
            tests/paid-content-boundary.test.mjs \
            tests/paid-content-media.test.mjs \
            tests/growth-client.test.mjs \
            tests/embedded-enrollment-checkout.test.mjs \
            tests/stripe-webhook-paid-enrollment-email.test.mjs \
            tests/transactional-email-redesign.test.mjs \
            tests/readiness-sales-prompt.test.mjs

      - name: Inventory the pinned paid course for private migration (no credentials or writes)
        run: |
          env -i PATH="$PATH" node scripts/paid-course-cutover.mjs --inventory

      - name: Validate founder review ledger in isolated PostgreSQL (no hosted database)
        run: |
          npm install --prefix /tmp/aimt-review-sql-test --no-audit --no-fund @electric-sql/pglite@0.5.15
          PGLITE_MODULE=file:///tmp/aimt-review-sql-test/node_modules/@electric-sql/pglite/dist/index.js node --test tests/founder-review-sql.test.mjs tests/founder-review-flow.test.mjs

  private-course-staging-upload:
    name: Manually stage paid assets in private Supabase Storage
    # NEVER run automatically for a PR, push, deployment, or schedule.
    # Run workflow manually on the exact review branch only. The GitHub
    # environment must exist and contain its own secret, with owner approval.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/review/aimt-security-meta-2026-11-19' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aimt-private-course-staging
    permissions:
      contents: read
    env:
      SUPABASE_URL: https://epcnkncyxqgscrejinwr.supabase.co
      PAID_ASSETS_BUCKET: aimt-paid-content
      AIMT_PAID_MIGRATION_MAX_BYTES: "300000000"
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Require protected credential and exact review branch
        run: |
          test "$GITHUB_REF" = "refs/heads/review/aimt-security-meta-2026-11-19"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test "$(git status --porcelain)" = ""
      - name: Confirm the complete, pinned payload fits the byte ceiling
        run: node scripts/paid-course-cutover.mjs --inventory
      - name: Upload missing private course assets and compare hashes
        run: node scripts/paid-course-cutover.mjs --upload
      - name: Recheck every private object without modifying it
        run: node scripts/paid-course-cutover.mjs --verify
