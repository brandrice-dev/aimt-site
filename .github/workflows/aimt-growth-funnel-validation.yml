name: AIMT Growth Funnel Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/api/readiness/**'
      - 'functions/api/admin/readiness-followups.js'
      - 'scripts/readiness-followups-run.mjs'
      - 'tests/readiness-followups.test.mjs'
      - 'tests/aimt-free-tools.test.mjs'
      - 'free-tools.html'
      - 'head-spa-service-cost.html'
      - 'first-service-blueprint.html'
      - 'assets/css/aimt-free-tools.css'
      - 'assets/js/aimt-service-cost-core.mjs'
      - 'assets/js/aimt-first-service-blueprint-core.mjs'
      - 'assets/js/aimt-course-resources.js'
      - 'sitemap.xml'
      - 'tests/admin-readiness-leads-layout.test.mjs'
      - 'supabase/migrations/20261104_add_readiness_followup_campaign.sql'
      - '.github/workflows/aimt-readiness-followups.yml'
      - 'functions/_lib/readiness/**'
      - 'functions/_lib/email/aimt-email-shell.mjs'
      - 'tests/readiness-profile-email.test.mjs'
      - 'functions/api/admin/readiness-leads.js'
      - 'functions/api/admin/checkout-diagnostics.js'
      - 'head-spa-readiness.html'
      - 'my-aimt.html'
      - 'readiness-enroll.html'
      - '_routes.json'
      - 'tests/readiness-final-decision.test.mjs'
      - 'admin.html'
      - 'assets/js/aimt-readiness-config.js'
      - 'tests/growth-funnel-repair.test.mjs'
      - '.github/workflows/aimt-growth-funnel-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Run offline growth, readiness, checkout regression tests
        run: |
          env -i PATH="$PATH" node --test \
            tests/readiness-profile-email.test.mjs \
            tests/readiness-followups.test.mjs \
            tests/aimt-free-tools.test.mjs \
            tests/admin-readiness-leads-layout.test.mjs \
            tests/readiness-final-decision.test.mjs \
            tests/growth-funnel-repair.test.mjs \
            tests/growth-measurement.test.mjs \
            tests/growth-client.test.mjs \
            tests/embedded-enrollment-checkout.test.mjs \
            tests/readiness-sales-prompt.test.mjs
