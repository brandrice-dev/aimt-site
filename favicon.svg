<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AIMT simplified mark: follicle motif from the badge, flat for small sizes -->
  <circle cx="32" cy="32" r="30" fill="#4a1f27"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#c9c4bd" stroke-width="1.6"/>
  <!-- outer orbit -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#c9c4bd" stroke-width="1.6"/>
  <!-- inner orbit -->
  <circle cx="32" cy="32" r="9.5" fill="none" stroke="#c9c4bd" stroke-width="1.4"/>
  <!-- nucleus -->
  <circle cx="32" cy="32" r="3.4" fill="#c9c4bd"/>
  <!-- orbit dots (8 outer) -->
  <g fill="#c9c4bd">
    <circle cx="32" cy="15" r="2.4"/>
    <circle cx="44" cy="20" r="2.4"/>
    <circle cx="49" cy="32" r="2.4"/>
    <circle cx="44" cy="44" r="2.4"/>
    <circle cx="32" cy="49" r="2.4"/>
    <circle cx="20" cy="44" r="2.4"/>
    <circle cx="15" cy="32" r="2.4"/>
    <circle cx="20" cy="20" r="2.4"/>
  </g>
</svg>
